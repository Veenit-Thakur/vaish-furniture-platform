<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Customize Chair | VAISH</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --brand:#FFB6CF;
}
*{
  box-sizing:border-box;
  margin:0; padding:0;
}
body{
  font-family:Poppins, sans-serif;
  background: linear-gradient(135deg, #2C5364, #203A43, #0F2027);
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAVBAR */
nav{
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 60px;
}
nav ul{
  display:flex; gap:30px; list-style:none;
}
nav a{
  color:white; text-decoration:none; font-weight:500;
}
.btn{
  background:var(--brand); border:none; cursor:pointer;
  padding:10px 18px; border-radius:10px; font-weight:600; color:#111;
  transition:.3s;
}
.btn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255,182,207,.55);
}

/* MAIN LAYOUT */
.wrap{
  flex:1;
  display:grid;
  grid-template-columns:1fr 380px;
  gap:60px;
  padding:60px;
}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;}
}

/* PREVIEW SIDE */
.preview-area{
  display:flex; flex-direction:column; align-items:center; gap:18px;
}

.thumbs{
  display:flex; gap:12px;
}
.thumb{
  width:80px; height:80px; border-radius:14px; overflow:hidden;
  cursor:pointer; opacity:.75; transition:.3s;
  box-shadow:0 0 8px rgba(0,0,0,.35);
}
.thumb img{
  width:100%; height:100%; object-fit:cover;
}
.thumb:hover,
.thumb.active{
  opacity:1;
  transform:scale(1.08);
}

/* MAIN IMAGE STAGE */
.stage{
  width: 340px;
  height: 340px;
  display:flex;
  align-items:center; justify-content:center;
  background: rgba(255,255,255,.10);
  backdrop-filter: blur(14px);
  border-radius: 22px;
  overflow:hidden;
  box-shadow: 0 0 35px rgba(0,0,0,.45);
}
#chair-img{
  width:90%;
  height:90%;
  object-fit:contain;
  object-position:center;
  transform: rotateX(4deg) rotateY(-6deg) translateY(4px);
  transition: transform .65s cubic-bezier(.16,.72,.48,1.14), filter .35s ease;
  filter: drop-shadow(0 20px 25px rgba(0,0,0,.45));
}
.stage:hover #chair-img{
  transform: rotateX(0deg) rotateY(0deg) translateY(-6px) scale(1.08);
  filter: drop-shadow(0 28px 40px rgba(0,0,0,.55));
}

/* RIGHT SIDE PANEL */
.panel{
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  padding:26px;
  border-radius:20px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.18) inset,
    0 18px 45px rgba(0,0,0,0.45);
  display:flex; flex-direction:column; gap:20px;
}
.panel:hover{
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.28) inset,
    0 22px 55px rgba(0,0,0,0.55);
}
label{font-size:14px; opacity:.88;}

select, input[type="range"]{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none; outline:none;
  background:rgba(255,255,255,.85);
  font-weight:600;
  transition:.3s;
}
select:hover, input[type="range"]:hover{
  background:rgba(255,255,255,.95);
}

/* PRICE */
.price{
  font-size:26px;
  font-weight:800;
  color:#ffffff;
  text-shadow:0 0 12px rgba(0, 179, 255, 0.55);
}

</style>
</head>

<body>

<nav>
  <h1 style="font-family:'Rubik Glitch Pop';">VAISH 🪑</h1>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="order-inquiry.html">Order</a></li>
    <li><a href="learnmore.html">About</a></li>
  </ul>
  <button class="btn" onclick="location.href='register.html'">Register</button>
</nav>

<section class="wrap">

  <!-- LEFT SIDE PREVIEW -->
  <div class="preview-area">
    <div class="thumbs" id="thumbs">
      <div class="thumb active" data-img="https://5.imimg.com/data5/SELLER/Default/2022/9/JK/HM/OR/94821983/wooden-rocking-chair-500x500.jpg"><img src="https://5.imimg.com/data5/SELLER/Default/2022/9/JK/HM/OR/94821983/wooden-rocking-chair-500x500.jpg"></div>
      <div class="thumb" data-img="https://woodworm.in/cdn/shop/files/how-of-woodworm-aristrocrat-winged-armchair-natural-solidwood-upholstered-seat-with-back-cushion-honey-finish-lifestyle-premium-furniture.jpg?v=1748278933"><img src="https://woodworm.in/cdn/shop/files/how-of-woodworm-aristrocrat-winged-armchair-natural-solidwood-upholstered-seat-with-back-cushion-honey-finish-lifestyle-premium-furniture.jpg?v=1748278933"></div>
      <div class="thumb" data-img="https://m.media-amazon.com/images/I/81QxA1uZKBL._AC_UF894,1000_QL80_.jpg"><img src="https://m.media-amazon.com/images/I/81QxA1uZKBL._AC_UF894,1000_QL80_.jpg"></div>
      <div class="thumb" data-img="https://5.imimg.com/data5/SELLER/Default/2025/9/549340334/DK/WQ/NU/252200003/img-20250929-013839-500x500.jpg"><img src="https://5.imimg.com/data5/SELLER/Default/2025/9/549340334/DK/WQ/NU/252200003/img-20250929-013839-500x500.jpg"></div>
    </div>

    <div class="stage">
      <img id="chair-img" src="https://5.imimg.com/data5/SELLER/Default/2022/9/JK/HM/OR/94821983/wooden-rocking-chair-500x500.jpg">
    </div>
  </div>

  <!-- RIGHT SIDE CONTROLS -->
  <div class="panel">
    <h2>Customize Chair 🎨</h2>

    <label>Finish</label>
    <select id="finish">
      <option value="1200" data-img="https://5.imimg.com/data5/SELLER/Default/2022/9/JK/HM/OR/94821983/wooden-rocking-chair-500x500.jpg">Light Wood</option>
      <option value="1500" data-img="https://i.etsystatic.com/54233155/r/il/0214db/7014388616/il_fullxfull.7014388616_a4lc.jpg">Dark Wood</option>
    </select>

    <label>Height: <span id="h-val">42</span>"</label>
    <input type="range" id="height" min="36" max="48" value="42">

    <label>Cushion</label>
    <select id="cushion">
      <option value="0" data-img="https://5.imimg.com/data5/SELLER/Default/2022/9/JK/HM/OR/94821983/wooden-rocking-chair-500x500.jpg">No Cushion</option>
      <option value="450" data-img="https://woodworm.in/cdn/shop/files/how-of-woodworm-aristrocrat-winged-armchair-natural-solidwood-upholstered-seat-with-back-cushion-honey-finish-lifestyle-premium-furniture.jpg?v=1748278933">Soft Cushion</option>
      <option value="800" data-img="https://m.media-amazon.com/images/I/81QxA1uZKBL._AC_UF894,1000_QL80_.jpg">Premium Cushion</option>
      <option value="1200" data-img="https://5.imimg.com/data5/SELLER/Default/2025/9/549340334/DK/WQ/NU/252200003/img-20250929-013839-500x500.jpg">Premium Pro</option>
    </select>

    <div class="price">₹ <span id="price">0</span></div>
    <button class="btn" onclick="location.href='order-inquiry.html'">Order Now 🚚</button>
  </div>

</section>

<script>
const img = document.getElementById("chair-img");
const finish = document.getElementById("finish");
const cushion = document.getElementById("cushion");
const height = document.getElementById("height");
const price = document.getElementById("price");
const hVal = document.getElementById("h-val");
const thumbs = document.getElementById("thumbs");

function sync(){
  const imgLink = cushion.value != "0"
    ? cushion.selectedOptions[0].dataset.img
    : finish.selectedOptions[0].dataset.img;
  img.src = imgLink;
  img.style.transform = `scale(${height.value/42})`;
  price.textContent = parseInt(finish.value) + parseInt(cushion.value) + (height.value * 2);
  hVal.textContent = height.value;
}

finish.onchange = cushion.onchange = height.oninput = sync;

thumbs.onclick = e=>{
  const t = e.target.closest(".thumb"); if(!t) return;
  document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  img.src = t.dataset.img;
} 
img.style.transform = `scale(${height.value/42})`;


sync();
</script>

</body>
</html>
