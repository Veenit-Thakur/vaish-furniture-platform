<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carpenter Seller Registration</title>  

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Foldit:wght@100..900&family=Rubik+Glitch+Pop&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
background: #2980B9;  
background: -webkit-linear-gradient(to top, #FFFFFF, #6DD5FA, #2980B9);  
background: linear-gradient(to bottom, #FFFFFF, #6DD5FA, #2980B9);  
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 0;
  }

  .form-container {
    width: 520px;
   background: #2980B9; 
background: -webkit-linear-gradient(to bottom, #FFFFFF, #6DD5FA, #2980B9); 
background: linear-gradient(to top, #FFFFFF, #6DD5FA, #66acd8c7); 
    color: #2C2C2C;
    border-radius: 14px;
    padding: 40px 45px;
    box-shadow: 0 0 25px rgba(0,0,0,0.45);
    animation: slideFade 0.8s ease;
    border: .0001px solid;
  }

  @keyframes slideFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    margin-bottom: 4px;
    color: #3C2F23;
  }

  p.note {
    text-align: center;
    margin-bottom: 25px;
    color: #4D4D4D;
  }

  label {
    margin-top: 18px;
    font-weight: 600;
    display: block;
    color: #3A3A3A;
  }

  input, textarea, select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1.5px solid #C9C3BA;
    background: #FFFFFF;
    font-size: 15px;
    color: #2C2C2C;
    transition: .25s;
  }

  input::placeholder, textarea::placeholder {
    color: #8A8A8A;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #8B6F4F;
    box-shadow: 0 0 0 2px rgba(139, 111, 79, .3);
    outline: none;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    margin-top: 30px;
    border-radius: 50px;
    border: none;
    background: #8B6F4F; 
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
    transition: .3s ease;
  }

  .btn-submit:hover {
    background: #6d543d;
    transform: scale(1.05);
  }
</style>

</head>
<body>

<div class="form-container">
 <div class="logo">
        <h1 style="color: rgb(12, 14, 19); font-family: Rubik Glitch Pop; font-weight: 900; text-align: center;">VAISH&#129681; </h1>
      </div>  <p class="note" style="color: black;"><b> Become an official verified furniture seller.</b></p>

  <form id="sellerForm">

    <label>Business / Carpenter Name</label>
    <input type="text" placeholder="Sharma Furniture Works" required>

    <label>City, State</label>
    <input type="text" placeholder="Jodhpur, Rajasthan" required>

    <label>WhatsApp Number</label>
    <input type="tel" placeholder="Example: 9876543210" required>

    <label>Furniture Category</label>
    <select required>
      <option value="">Choose category</option>
      <option>Solid Sheesham Wood</option>
      <option>Teak & Premium Finish</option>
      <option>Custom Designed Carved Pieces</option>
      <option>Home Decor Small / Gift Items</option>
    </select>

    <label>Upload Product Images</label>
    <input type="file" accept="image/*" multiple>

    <label>Price Range of Your Items</label>
    <input type="text" placeholder="₹2000 - ₹50,000">

    <label>Describe Your Work</label>
    <textarea rows="4" placeholder="Tell customers what makes your craftsmanship unique..."></textarea>

    <button class="btn-submit">Submit</button>
  </form>
</div>

<script>
document.getElementById("sellerForm").addEventListener("submit", e => {
  e.preventDefault();
  alert("✅ Submitted! Our team will review your details and contact you soon.");
});
</script>

</body>
</html>
