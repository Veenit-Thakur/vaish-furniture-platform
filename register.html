<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Chairs</title>
    <link rel="stylesheet" href="register.css"> 
    
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-toggle">
                <button id="login-toggle" class="active">Sign In</button>
                <button id="register-toggle">Sign Up</button>
            </div>
            
            <!-- Sign In Form-->
            <form id="login-form" class="form active">
                <h2>Sign In</h2>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Sign In</button>
                <p class="link">Forgot password? <a href="#">Reset</a></p>
            </form>
            


            <!-- Sign Up Form -->
            <form id="register-form" class="form">
                <h2>Sign Up</h2>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit" class="btn">Sign Up</button>
                <p class="link">Already have an account? <a href="#" onclick="toggleForm('login')">Sign In</a></p>
            </form>
        </div>
    </div>
    
    <script src="register.js"></script> 
</body>
</html>
